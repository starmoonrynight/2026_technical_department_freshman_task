<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的发布 · 校园失物招领</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="container">
    <h2 class="page-title">我的发布</h2>
    <p class="page-subtitle">这里可以看到自己发布的全部信息，包括还在审核中的。</p>

    <div class="tabs" id="tabs">
      <button data-audit="" class="active">全部</button>
      <button data-audit="pending">待审核</button>
      <button data-audit="approved">已通过</button>
      <button data-audit="rejected">已驳回</button>
    </div>

    <div class="alert" id="alert"></div>

    <div class="card" style="padding:0">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>标题</th>
              <th>类型</th>
              <th>分类</th>
              <th>进度</th>
              <th>审核</th>
              <th>发布时间</th>
              <th style="width:210px">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="pager" id="pager"></div>
  </main>

  <footer class="site-footer">校园失物招领系统 · Node.js + Express + SQLite 示例项目</footer>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/my.js"></script>
</body>
</html>
